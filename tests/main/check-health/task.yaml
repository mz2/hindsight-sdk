summary: Launch workshop and validate hindsight API and control plane

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  echo "[1/2] hindsight-api command is available"
  workshop exec -- sh -c 'command -v hindsight-api'

  echo "[2/2] hindsight-api service is active"
  workshop exec -- systemctl --user status hindsight-api.service --no-pager | MATCH 'Active: active \(running\)'

debug: |
  workshop tasks
  workshop exec -- sh -c 'command -v hindsight-api' || true
  workshop exec -- systemctl --user status hindsight-api.service --no-pager --lines=40 || true
  workshop exec -- systemctl --user status hindsight-control-plane.service --no-pager --lines=40 || true
